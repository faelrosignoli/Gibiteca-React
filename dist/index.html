    <script>
      /* Antes do React, senão quem escolheu outro tema vê o Moss piscar
         enquanto o bundle carrega. A lista está repetida aqui de propósito:
         este script roda ANTES de qualquer módulo, então não há de onde
         importá-la. Mexeu em TEMAS_VALIDOS no store, mexe aqui.
         Em try/catch porque navegador sem storage existe. */
      try {
        var t = localStorage.getItem('gibiteca_tema')
        if (['nockout', 'candy', 'midnight'].indexOf(t) >= 0)
          document.documentElement.dataset.tema = t
      } catch (e) {}
    </script>
